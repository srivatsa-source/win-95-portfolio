<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Test - Ora Portfolio</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #008080;
            color: white;
        }
        .test-section {
            background: #c0c0c0;
            color: black;
            padding: 20px;
            margin: 20px 0;
            border: 2px solid #000;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #c0c0c0;
            border: 2px outset #fff;
        }
        button:active {
            border-style: inset;
        }
        pre {
            background: #000;
            color: #0f0;
            padding: 10px;
            overflow-x: auto;
        }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🐱 Ora Portfolio Debug Console</h1>

    <div class="test-section">
        <h2>Test 1: Chatbot Backend</h2>
        <button onclick="testChatbot()">Test Chatbot API</button>
        <div id="chatbot-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Supabase Connection</h2>
        <button onclick="testSupabase()">Test Supabase</button>
        <div id="supabase-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Visitor Count</h2>
        <button onclick="testVisitorCount()">Test Visitor Count</button>
        <div id="visitor-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 4: Guestbook</h2>
        <button onclick="testGuestbook()">Load Guestbook Entries</button>
        <div id="guestbook-result"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lwkmulqplffbiwbwggji.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3a211bHFwbGZmYml3YndnZ2ppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI4NjQyNTYsImV4cCI6MjA3ODQ0MDI1Nn0.EBwgzNQJ5jTb0-KDfqSH4Huao0hwmsrMbtClEKhP3BU';
        const API_URL = 'https://win-95-portfolio-ora.onrender.com/api/chat';

        async function testChatbot() {
            const resultDiv = document.getElementById('chatbot-result');
            resultDiv.innerHTML = '<p>Testing chatbot...</p>';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: 'Hello Ora!' })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                resultDiv.innerHTML = `
                    <p class="success">✅ Chatbot Working!</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Chatbot Error</p>
                    <pre>${error.message}</pre>
                `;
            }
        }

        async function testSupabase() {
            const resultDiv = document.getElementById('supabase-result');
            resultDiv.innerHTML = '<p>Testing Supabase connection...</p>';

            try {
                // Test visitor_count table
                const response = await fetch(`${SUPABASE_URL}/rest/v1/visitor_count?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                resultDiv.innerHTML = `
                    <p class="success">✅ Supabase Connected!</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Supabase Error</p>
                    <pre>${error.message}</pre>
                `;
            }
        }

        async function testVisitorCount() {
            const resultDiv = document.getElementById('visitor-result');
            resultDiv.innerHTML = '<p>Testing visitor count...</p>';

            try {
                // Get current count
                const getResponse = await fetch(`${SUPABASE_URL}/rest/v1/visitor_count?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                const currentData = await getResponse.json();
                const currentCount = currentData[0]?.count || 0;

                // Increment count
                const newCount = currentCount + 1;
                const updateResponse = await fetch(`${SUPABASE_URL}/rest/v1/visitor_count?id=eq.1`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({ 
                        count: newCount,
                        last_updated: new Date().toISOString()
                    })
                });

                const updatedData = await updateResponse.json();
                
                resultDiv.innerHTML = `
                    <p class="success">✅ Visitor Count Updated!</p>
                    <pre>Previous: ${currentCount}\nNew: ${newCount}\nResponse: ${JSON.stringify(updatedData, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Visitor Count Error</p>
                    <pre>${error.message}\n${error.stack}</pre>
                `;
            }
        }

        async function testGuestbook() {
            const resultDiv = document.getElementById('guestbook-result');
            resultDiv.innerHTML = '<p>Testing guestbook...</p>';

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/guestbook?select=*&order=created_at.desc&limit=5`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                resultDiv.innerHTML = `
                    <p class="success">✅ Guestbook Loaded!</p>
                    <p>Total entries: ${data.length}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">❌ Guestbook Error</p>
                    <pre>${error.message}</pre>
                `;
            }
        }
    </script>
</body>
</html>
